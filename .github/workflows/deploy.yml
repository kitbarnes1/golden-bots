name: Deploy

# Builds the image, pushes it to ECR and tells the EC2 instance to redeploy.
# Needs these repository variables (Settings > Secrets and variables > Actions >
# Variables), all printed by `terraform output github_actions_variables`:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, EC2_INSTANCE_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # GitHub can deliver a push late, after a newer commit has already gone out, and
  # deploying it then would put the older version back. So a push only deploys if it's
  # still the tip of main (a newer push deploys instead). Run by hand, it deploys
  # whatever you pick.
  current:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$EVENT" != push ] || [ "$TIP" = "$SHA" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: main has moved on to $TIP, which deploys instead."
            echo deploy=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: current
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && needs.current.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Make sure security updates install themselves daily (dnf-automatic),
          # including on servers built before that was in user-data. Harmless to repeat.
          PARAMS=$(jq -n --arg tag "$TAG" '{commands: [
            "(rpm -q dnf-automatic >/dev/null || dnf -y -q install dnf-automatic) && sed -i \"s/^upgrade_type *=.*/upgrade_type = security/\" /etc/dnf/automatic.conf && systemctl enable --now dnf-automatic-install.timer || echo \"Could not set up automatic updates\"",
            "/opt/golden-balls/deploy.sh \($tag)"
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $TAG" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          [ "$STATUS" = "Success" ]
